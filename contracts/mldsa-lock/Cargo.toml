[package]
name = "mldsa-lock"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CKB lock script: ML-DSA (FIPS 204) signature over the transaction, levels 44, 65 and 87"

[dependencies]
ckb-std = "1.1"
blake2b-ref = "0.3"
fips204 = { version = "0.5", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
