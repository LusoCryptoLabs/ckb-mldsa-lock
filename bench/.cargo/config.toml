# Same flags as our ckb-confidential scripts: B extension on, atomics off (CKB-VM has no A extension;
# forced-atomics lowers them to plain loads and stores, fine in a single-threaded VM).
[target.riscv64imac-unknown-none-elf]
rustflags = ["-C", "target-feature=-a,+forced-atomics,+zba,+zbb,+zbc,+zbs"]
